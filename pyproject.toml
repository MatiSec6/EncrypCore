[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "encrypcore"
version = "1.0.0"
description = "EncrypCore: a terminal cryptography toolkit (AES, ECC, JWT, TOTP, password hashing, and educational tools)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MatiSec6", email = "matisec.dev@gmail.com" }]
requires-python = ">=3.10"
keywords = ["cryptography", "cli", "aes", "ecc", "jwt", "totp", "argon2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
all = [
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.0.0",
    "pyotp>=2.9.0",
    "PyJWT>=2.8.0",
    "mnemonic>=0.20",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
encrypcore = "encrypcore.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as parameter defaults by design
extend-immutable-calls = ["typer.Argument", "typer.Option"]
